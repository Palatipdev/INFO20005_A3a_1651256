<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Detail</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <main class = "detail-container">
    <!-- NAV -->
    <header>
        <nav class = "navbar">
            <a href="class.html">Classes</a>
            <img src="images/logo.png" alt = "Planet K9 Logo" class = "logo">
            <a href= "cart.html" class = "cart-link">
                <span class = "material-icons">shopping_cart</span>
                <span id = "cart-badge" class="cart-badge"></span>
            </a>
        </nav>
    </header>

    <!-- Class Image -->
    <img id="class-image" src="" alt="" class="detail-img">

    <section class="paddedContainer">
        <!-- Class Info -->
        <div class="class-info">
            <p id="class-level"></p>
            <h2 id="class-name"></h2>
            <p id="class-location"></p>
        </div>

        <!-- Date Pills -->
        <div class ="date-section">
            <h4>Date Selection: <span class = "time-note">All Classes run from 9:00 AM</span></h4>
            <div id="date-pills"></div>
        </div>


        <!-- Whats Included -->
        <div class ="included-section">
            <h3>What's Included:</h3>
            <div id="included-list"></div>
        </div>

    </section>
    
    <!-- Price -->
    <div class="price-section">
        <div class="price-label">Class Price</div>
        <p id="class-price"></p>
        <button id="book-button" onclick="addToCart()">BOOK NOW</button>
    </div>
 
    </main>


    <script src="js/classes.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/class-details.js"></script>
</body>
</html>

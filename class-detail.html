<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <!-- NAV -->
    <header>
        <nav class = "navbar">

            <a href= "cart.html" class = "cart-link">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>

    <!-- Information Bar -->
    <div class="info-bar">
        <img src="images/logo.png" alt="Planet K9 Logo" class="logo">
        
        <div class="info-items-group">
            <div class="info-item">
                <img src="images/location_desktop.png" alt="Location">
                <div>
                    <p class="info-label">Location:</p>
                    <p class="info-value">Spotswood</p>
                </div>
            </div>
            <div class="info-item">
                <img src="images/phone_desktop.png" alt="Phone">
                <div>
                    <p class="info-label">Phone:</p>
                    <p class="info-value">0431 418 688</p>
                </div>
            </div>
            <div class="info-item">
                <img src="images/opening_hours_desktop.png" alt="Hours">
                <div>
                    <p class="info-label">Opening Hours:</p>
                    <p class="info-value">Open 7 Days: 8:00am - 5:00pm</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Bar (Desktop) -->
    <nav class="navbar desktop-nav">
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="class.html" class="nav-link active">Classes</a>
            <a href="cart.html" class="nav-link">Cart</a>
            <a href="#" class="nav-link disabled">Meet Our Team</a>
            <a href="#" class="nav-link disabled">Contact</a>
        </div>
    </nav>

    <!-- NAV -->
    <header>
        <nav class = "navbar">
            <a href="index.html">Homepage</a>
            <img src="images/logo.png" alt = "Planet K9 Logo" class = "logo">
            <a href= "cart.html" class = "cart-link">
                <span class = "material-icons">shopping_cart</span>
                <span id = "cart-badge" class="cart-badge"></span>
            </a>
        </nav>
    </header>

    
        <!-- Puppy Training -->
        <section class = "puppy-training">
            <div class="section-header">Puppy Training Classes</div>
            <div class="classArea" id="puppy-cards"></div>
        </section>

        <!-- Dog Training -->
        <section class="dog-training">
            <div class = "section-header">Dog Training Classes</div>
            <div class="classArea" id="dog-cards"></div>
        </section>
    

    <script src="js/classes.js"></script>
    <script src="js/shared.js"></script>
</body>
</html>

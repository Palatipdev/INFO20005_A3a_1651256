<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation Page</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
            <!-- NAV -->
    <header>
        <nav class = "confirm-navbar">
            <img src="images/logo.png" alt = "Planet K9 Logo" class = "logo">
        </nav>
    <header>

    <main class="paddedContainer">
        <!-- Paw Icon Top Left -->
        <img src="images/dogPaw.png" alt="Paw" class="paw-decoration">

        <section class="confirmation-card">

            <div class="confirmation-header">
                <img src="images/tickmark.png" alt="Checkmark" class="tick-icon">
                <h1>Booking Confirmed!</h1>
                <img src="images/tickmark.png" alt="Checkmark" class="tick-icon">
            </div>

            <p class="confirmation-message">We're excited to see you at the session!</p>

            <!-- Running Dogs Divider -->
            <div class="dogs-divider">
                <img src="images/blackdog.png" alt="Dog">
                <img src="images/blackdog.png" alt="Dog">
                <img src="images/blackdog.png" alt="Dog">
                <img src="images/blackdog.png" alt="Dog">
                <img src="images/blackdog.png" alt="Dog">
            </div>

            <!-- Contact Info -->
            <div class="contact-info">
                <p>Need help with your booking? We're happy to help!</p>
                <p><strong>Contact: 0431 418 688</strong></p>
                <p><strong>Email: PlanetK9@gmail.com</strong></p>
            </div>
        </section>


                <!-- Dog Peeking Image -->
        <img src="images/dog-peeking.png" alt="Dog peeking" class="dog-peeking">

        <!-- Footer Text & Button -->
        <div class="confirmation-footer">
            <a href="index.html" class="checkout-btn">BACK TO HOME</a>
        </div>

    </main>

    <script src="js/classes.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/confirmation.js"></script>

</body>
</html>
